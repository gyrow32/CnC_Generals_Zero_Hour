; Files under mods/local-dev/files are packed with their relative path.
; This harmless object proves that new INI files can be added without replacing retail files.
Object LocalDevMarker
  DisplayName = OBJECT:Crate
  EditorSorting = MISC_MAN_MADE
  KindOf = IMMOBILE NO_COLLIDE

  Draw = W3DModelDraw ModuleTag_LocalDevDraw
    DefaultConditionState
      Model = PMCrate01
    End
  End

  Body = ActiveBody ModuleTag_LocalDevBody
    MaxHealth = 100.0
    InitialHealth = 100.0
  End

  Geometry = BOX
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 10.0
End

